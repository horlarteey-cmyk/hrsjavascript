<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" name="" id="input">
    <button onclick="show()">submit</button>
    <input id="output" disabled>
    <span id="result"></span>
</body>
<script>
    function show(){
        let input = document.getElementById('input').value.trim()
        let output = document.getElementById('output')
        let result = document.getElementById('result')

        if (input === '1'){
            result.textContent = 'Monday'
            output.value = "Monday"
            console.log('Monday')
        }else if (input === "2"){
            result.textContent = 'Tuesday'
            output.value = "Tuesday"
            console.log('Tuesday')
        }else if (input === "3"){
             result.textContent = 'Wednesday'
            output.value = "Wednesday"
            console.log('Wednesday')

        }else if (input === "4"){
             result.textContent = 'Thursday'
            output.value = "Thursday"
            console.log('Thursday')
            
        }else if (input === "5"){
             result.textContent = 'Friday'
            output.value = "Friday"
            console.log('Friday')
            
        }else if (input === "6"){
             result.textContent = 'Saturday'
            output.value = "Saturday"
            console.log('Saturday')
            
        }else if (input === "7"){
            result.textContent = 'Sunday'
            output.value = "Sunday"
            console.log('Sunday')
            
        }else{
            result.textContent = 'Please enter a valid day number (1-7)'
            output.value = "Please enter a valid day number (1-7)"
            console.log('Please enter a valid day number (1-7)')
            
        }


    }
</script>
</html>
