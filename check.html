<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    </style>
</head>
<body>
    <div class="top">
    <p>INPUT :</p> <input type="number" id="input">
    </div>
    <div class="mid">
        <span id="output"></span>
        <!-- <p>RATE :  <h3 id="output"></h3></p> -->
    </div>
    <div class="down">
        <span id=" result"></span>
        <!-- <p>Total Bill : <h1 id=" result"></h1></p>  -->
    </div>
    <button onclick="show()">check</button>
</body>
<script>
    function show(){
        let input = document.getElementById('input').value.trim()
        let output = document.getElementById('output')
        let result = document.getElementById('result')

        input = +input
        output = +output

        if (input >= 0 || input < 51){
            output.textContent = 50
            result.textContent = 'input * output.textContent'
        }
    }


</script>
