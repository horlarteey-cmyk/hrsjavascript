   <div class="hero">
        <div class="input">
          <input id="input1" value="0" type="number" />
          <span>*********</span>
          <input id="input2" type="number" value="0" />
        </div>
        <div class="divider"></div>
      <div>
        <button onclick="show()">multiply</button>
      </div>
      <p id="result"></p>
    </div>

    
</body>
<script> 
function show() {

    // Get the input values
    let input1 = document.getElementById("input1").value;
    let input2 = document.getElementById("input2").value;

    // Get the output element
    let result = document.getElementById("result");

    // Validate the input fields
    if (input1 === "" || input2 === "") {

    result.innerHTML = "Please enter valid numbers in both fields";
    return;

    }

    // Convert the input values to numbers
    input1 = Number(input1);
    input2 = Number(input2);

    // Check if Input A is greater than Input B
    if (input1 > input2) {
        result.innerHTML = "YOUR FIRST INPUT MUST BE LESSER THAN OR EQUAL TO YOUR SECOND INPUT";
        return;

    }

    // Create an empty string to store the table
    let output = "";

    // Generate the 12 times table
    for (let i = input1; i <= input2; i++) {

        output = `12 * ${i} = ${12 * i}<br>`;

    }

    // Display the result on the webpage
    result.innerHTML = output;

}
