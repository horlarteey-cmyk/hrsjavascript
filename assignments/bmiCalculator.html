<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }

        .underweight {
            background: #fff3cd;
            color: #856404;
        }

        .normal {
            background: #d4edda;
            color: #155724;
        }

        .overweight {
            background: #ffe5b4;
            color: #8a4b00;
        }

        .obese {
            background: #f8d7da;
            color: #721c24;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>BMI Calculator</h1>

        <p class="description">
            Enter your weight in kilograms and height in meters.
        </p>

        <div class="input-group">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" placeholder="e.g. 70" step="0.1">
        </div>

        <div class="input-group">
            <label for="height">Height (m)</label>
            <input type="number" id="height" placeholder="e.g. 1.75" step="0.01">
        </div>

        <button onclick="calculateBMI()">Calculate BMI</button>

        <div id="result"></div>
    </div>


    <script>
        function calculateBMI() {
            let weight = parseFloat(document.getElementById("weight").value);
            let height = parseFloat(document.getElementById("height").value);
            let result = document.getElementById("result");

            if (!weight && !height) {
            alert("Please enter your weight and height.")
            return;
            }
            else if (!weight) {
            alert("Please enter your weight.")
            return;
            } 
            else if (!height) {
            alert("Please enter your height.")
            return;
            } 
            else if (weight <= 0) {
            alert("Weight must be greater than 0.")
            return;
            } 
            else if (height <= 0) {
            alert("Height must be greater than 0.")
            return;
            }
            else if (weight <= height){
            alert("Weight must be greater than height")
            return;
            }
            else if (height > 3){
                alert("Please enter your height in meters")
                return;
            }

            let bmi = weight / (height * height);

            let category = ""

            if (bmi < 18.5) {
                category = "Underweight";
                result.className = "underweight";
            } 
            else if (bmi < 25) {
                category = "Normal weight";
                result.className = "normal";
            } 
            else if (bmi < 29.9) {
                category = "Overweight";
                result.className = "overweight";
            } 
            else if (bmi >= 30){
                category = "Obese"
                result.className = "obese"
            }
            else {
                category = "Please enter a valid number";
                result.className = "watch your weigth";
            }

            result.style.display = "block";
            result.innerHTML = `Your BMI is ${bmi.toFixed(1)} - ${category}`;
        }
    </script>

</body>
</html>
