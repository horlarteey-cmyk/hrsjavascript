<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }

        input {
            width: 200px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #444;
        }

        #message {
            text-align: center;
            margin: 15px 0;
            color: red;
            min-height: 20px;
        }

        #boxes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .color-box {
            height: 150px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-shadow: 0 1px 3px black;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }

            .form {
                flex-direction: column;
            }

            input,
            button {
                width: 100%;
            }

            .color-box {
                height: 120px;
            }
        }
    </style>
</head>
<body>
     <div class="container">

        <h1>Random RGB Color Generator</h1>

        <p class="description">
            Enter the number of color boxes you want to generate.
        </p>

        <div class="form">
            <input
                type="number"
                id="input"
                placeholder="Enter number"
                min="1"
                max="100"
            >

            <button onclick="show()">
                Generate Colors
            </button>
        </div>

        <p id="message"></p>

        <div id="boxes"></div>

    </div>
    
</body>

</html>
